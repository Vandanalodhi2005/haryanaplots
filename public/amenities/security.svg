<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #f0f0f0 0%, #e0e0e0 100%);">
  <!-- 24x7 Security -->
  <g>
    <circle cx="130" cy="120" r="30" fill="#FFD700"/>
    <polygon points="130,90 145,115 115,115" fill="#333"/>
    <rect x="95" y="160" width="70" height="80" fill="#333" rx="4"/>
