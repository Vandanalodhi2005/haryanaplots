<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #f0f0f0 0%, #e0e0e0 100%);">
  <!-- CCTV Camera -->
  <g>
    <rect x="100" y="80" width="200" height="140" fill="#333" rx="8" stroke="#666" stroke-width="2"/>
    <circle cx="200" cy="150" r="50" fill="#000"/>
    <circle cx="200" cy="150" r="40" fill="#1a1a2e"/>
    <circle cx="200" cy="150" r="30" fill="#0f3460"/>
    <circle cx="190" cy="140" r="8" fill="#00d4ff" opacity="0.8"/>
    <line x1="150" y1="100" x2="130" y2="75" stroke="#666" stroke-width="3"/>
    <line x1="250" y1="100" x2="270" y2="75" stroke="#666" stroke-width="3"/>
    <rect x="125" y="55" width="20" height="25" fill="#999" rx="2"/>
    <rect x="255" y="55" width="20" height="25" fill="#999" rx="2"/>
    <text x="200" y="260" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e7e34">CCTV Camera</text>
  </g>
</svg>